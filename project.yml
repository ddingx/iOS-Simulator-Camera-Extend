# SimCam 是一个普通的 macOS Xcode 工程。
#
#   $ brew install xcodegen
#   $ xcodegen generate
#   $ open SimCam.xcodeproj
#   ⌘R 跑 SimCam scheme（构建 App + 嵌入 Camera Extension + CLI）
#   ⌘U 跑 SimCamTests（unit tests）
#
# Code signing
# ------------
# Host (SimCamApp) and the system extension (SimCamExtension) are signed with
# your "Apple Development" identity (free Personal Team is enough). This is
# REQUIRED for TCC permission grants (Screen Recording / Camera / Microphone)
# to persist across rebuilds — see Configs/SimCamSigning.xcconfig for the
# full explanation. To configure your machine, copy
# Configs/SimCamSigning.local.xcconfig.template -> Configs/SimCamSigning.local.xcconfig
# and fill in your team id.
#
# SimCamHook (iOS dylib) and SimCamDemoApp (iOS demo) stay ad-hoc by design:
# the iOS Simulator's dyld won't load a dylib signed with an Apple Development
# cert into an otherwise ad-hoc-signed simulator process.

name: SimCam

configFiles:
  Debug: Configs/SimCamSigning.xcconfig
  Release: Configs/SimCamSigning.xcconfig

options:
  bundleIdPrefix: dev.simcam
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    # Defaults are inherited from Configs/SimCamSigning.xcconfig. With a fresh
    # clone they fall back to ad-hoc; with a local override they pick up your
    # Personal Team. Per-target overrides below force ad-hoc on the iOS dylib
    # and iOS demo (regardless of any local override).
    CODE_SIGN_STYLE: $(SIMCAM_CODE_SIGN_STYLE)
    CODE_SIGN_IDENTITY: $(SIMCAM_CODE_SIGN_IDENTITY)
    DEVELOPMENT_TEAM: $(SIMCAM_DEVELOPMENT_TEAM)
    CODE_SIGNING_REQUIRED: YES
    CODE_SIGNING_ALLOWED: YES
    ENABLE_HARDENED_RUNTIME: YES

targets:
  # ── macOS menubar app（默认 ⌘R 启动它） ─────────────────────────────
  SimCamApp:
    type: application
    platform: macOS
    sources:
      - path: Sources/SimCamCore
      - path: Sources/SimCamApp
    info:
      path: Generated/SimCamApp-Info.plist
      properties:
        LSUIElement: true   # 纯 menubar，无 Dock 图标
        CFBundleName: SimCam
        NSCameraUsageDescription: "SimCam reads your Mac camera so it can rebroadcast frames to the iOS Simulator."
        NSSystemExtensionUsageDescription: "Install the SimCam Virtual Camera so iOS Simulator (and any other AVFoundation client) can pick it up."
    entitlements:
      path: Generated/SimCamApp.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups:
          - dev.simcam.app
        com.apple.security.device.camera: true
        com.apple.security.device.audio-input: true
        com.apple.security.cs.disable-library-validation: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.simcam.app
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Inherit signing identity / style / team from xcconfig at root.
    dependencies:
      - target: SimCamExtension
        embed: true                    # 把 .systemextension 拷进
                                       # SimCamApp.app/Contents/Library/SystemExtensions/
        codeSign: true

  # ── CMIO Camera System Extension ───────────────────────────────────
  # 它是一个 `.systemextension` bundle，需要 `sudo systemextensionsctl
  # developer on` 才能用 ad-hoc 签名加载。bundle id 必须以 SimCamApp 的
  # bundle id 为前缀（dev.simcam.app.extension），否则 OSSystemExtensions
  # 会以 "different team identifier" 拒绝。
  SimCamExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: Sources/SimCamCore
      - path: Sources/SimCamExtension
    info:
      path: Generated/SimCamExtension-Info.plist
      properties:
        CFBundlePackageType: SYSX
        # CMIO Camera Extension 注册（Apple "Creating a camera extension with
        # Core Media IO" 样例的标准结构）。注意：不要再加 NSExtension dict，
        # 一旦加上 Xcode 会把它当成 Foundation appex（要求放进 PlugIns/），
        # 与 system extension（Library/SystemExtensions/）冲突。
        CMIOExtension:
          CMIOExtensionMachServiceName: $(PRODUCT_BUNDLE_IDENTIFIER)
        # sysextd cmio 类别校验要求此键存在，否则报：
        # "extension failed category property check: extensions belonging to
        #  the com.apple.system_extension.cmio category require the presence
        #  of the 'NSSystemExtensionUsageDescription' property."
        NSSystemExtensionUsageDescription: "SimCam exposes a virtual camera so iOS Simulator (and any AVFoundation client) can pick up frames captured by the SimCam menubar app."
    entitlements:
      path: Generated/SimCamExtension.entitlements
      properties:
        # Apple 文档要求 CMIO Camera Extension 必须开 sandbox。
        com.apple.security.app-sandbox: true
        # host 与 extension 共享数据。无 team prefix（ad-hoc 签名场景）。
        com.apple.security.application-groups:
          - dev.simcam.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.simcam.app.extension
        # IMPORTANT: filename (sans .systemextension) MUST equal bundle id.
        # Apple DTS (forums/thread/823200) confirms: with a mismatch, sysextd
        # rejects activation with the misleading message
        # "no policy, cannot allow apps outside /Applications"
        # even when the app is correctly placed under /Applications.
        PRODUCT_NAME: dev.simcam.app.extension
        # PRODUCT_NAME contains dots, so Swift module name must be set
        # explicitly (it can't contain dots).
        PRODUCT_MODULE_NAME: SimCamExtension
        # CFBundleExecutable should stay simple; otherwise launchd path lookup
        # gets confused.
        EXECUTABLE_NAME: SimCamExtension
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ENABLE_HARDENED_RUNTIME: YES
        # 必要：launchd 才会接受 mach service 注册。
        SWIFT_OBJC_BRIDGING_HEADER: ""
        WRAPPER_EXTENSION: systemextension
        # Inherit signing identity from xcconfig (must match host's team so
        # sysextd accepts the embedded extension).

  # ── 单元测试（⌘U 跑） ──────────────────────────────────────────────
  SimCamTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/SimCamCore
      - path: Tests/SimCamCoreTests
    settings:
      base:
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SimCamApp.app/Contents/MacOS/SimCamApp
    dependencies:
      - target: SimCamApp

  # ── iOS Simulator hook dylib：通过 DYLD_INSERT_LIBRARIES 注入到任何
  #    被测 app 进程，dyld 阶段就 swizzle AVFoundation。这就是 SimCam
  #    商业版的真实做法 —— 被测 app 用标准 AVFoundation API，零改动 ──
  SimCamHook:
    type: library.dynamic     # raw dylib (Mach-O dylib，不是 framework)
    platform: iOS
    sources:
      - path: Sources/SimCamHook
    settings:
      base:
        PRODUCT_NAME: SimCamHook
        EXECUTABLE_PREFIX: lib
        EXECUTABLE_EXTENSION: dylib
        MACH_O_TYPE: mh_dylib
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # DYLD_INSERT_LIBRARIES only works inside the simulator; this dylib
        # has no business existing on a real device, so we restrict to the
        # iphonesimulator SDK (build & install).
        SUPPORTED_PLATFORMS: "iphonesimulator"
        SDKROOT: iphonesimulator
        SKIP_INSTALL: YES
        ENABLE_HARDENED_RUNTIME: NO
        # ad-hoc 签名 + 不要 pin 到 @rpath；DYLD_INSERT_LIBRARIES 用绝对路径。
        DYLIB_INSTALL_NAME_BASE: "/usr/local/lib"
        DYLIB_COMPATIBILITY_VERSION: "1"
        DYLIB_CURRENT_VERSION: "1"
        # FORCE ad-hoc regardless of any local xcconfig override. iOS-Simulator
        # dyld silently refuses to inject a dylib signed with a Personal Team
        # cert into an ad-hoc-signed test app, which is what most simulator
        # apps are.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: YES
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        OTHER_LDFLAGS: "-framework AVFoundation -framework CoreMedia -framework CoreVideo -framework CoreImage -framework QuartzCore -framework UIKit -framework Foundation"

  # ── iOS demo app：跑在 Simulator 里。它**只用标准 AVFoundation API**，
  #    没有任何 SimCam framework 依赖；frames 由 SimCamHook.dylib 注入。 ──
  SimCamDemoApp:
    type: application
    platform: iOS
    sources:
      - path: Sources/SimCamDemoApp
    info:
      path: Generated/SimCamDemoApp-Info.plist
      properties:
        CFBundleName: SimCamDemo
        UILaunchScreen: {}
        NSCameraUsageDescription: "SimCam demo uses AVFoundation; in simulator the SimCamHook dylib feeds frames from the host SimCamApp."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.simcam.demo
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_HARDENED_RUNTIME: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # FORCE ad-hoc; matches what a typical simulator app looks like, so
        # SimCamHook.dylib injection is accepted by dyld.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""

schemes:
  SimCam:
    build:
      targets:
        SimCamApp: all
        SimCamExtension: all
        SimCamTests: [test]
    run:
      config: Debug
      executable: SimCamApp
    test:
      config: Debug
      targets:
        - SimCamTests
  SimCamDemo:
    build:
      targets:
        SimCamHook: all
        SimCamDemoApp: all
    run:
      config: Debug
      executable: SimCamDemoApp
